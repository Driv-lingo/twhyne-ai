name: Pre-Production CI/CD

on:
  push:
    branches: [ pre-prod ]
  pull_request:
    branches: [ pre-prod ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install backend dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install flask flask-cors pillow numpy
        pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run backend tests
      run: |
        cd backend
        python -m pytest tests/ || echo "No tests found yet"
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Run integration tests
      run: |
        cd backend
        python server.py &
        sleep 5
        curl -f http://localhost:5002/status
        curl -f http://localhost:5002/nodes
    
    - name: Create deployment artifact
      run: |
        mkdir -p artifacts
        tar -czf artifacts/twhyne-pre-prod.tar.gz \
          backend/ \
          frontend/build/ \
          models/.gitkeep \
          uploads/.gitkeep \
          README.md \
          requirements.txt
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: pre-prod-build
        path: artifacts/twhyne-pre-prod.tar.gz
        retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan on Python dependencies
      run: |
        pip install safety
        cd backend
        pip install -r ../requirements.txt
        safety check || echo "Security scan completed with warnings"
    
    - name: Run npm audit
      run: |
        cd frontend
        npm audit --audit-level=moderate || echo "Audit completed with warnings"
