version: '3.8'

services:
  snf-ai-backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    ports:
      - "5001:5001"  # Backend API
    volumes:
      - snf_models:/app/models      # Persist model files
      - snf_logs:/app/logs          # Persist logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  snf_models:
    driver: local
  snf_logs:
    driver: local
