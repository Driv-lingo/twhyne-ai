name: Build Docker Image (GPU)

# Manual-trigger only while the GPU tier is pre-release: each build is
# ~6GB and the runner has no GPU, so CI proves "CUDA image boots and
# answers in CPU-fallback mode" - GPU offload itself is validated on
# rented GPU minutes per docs/GPU_VALIDATION.md before any announcement.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk (CUDA base + build need the room)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (candidate, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          platforms: linux/amd64
          load: true
          push: false
          tags: twhyne/twhyne:gpu-candidate
          build-args: |
            TWHYNE_BUILD=${{ github.sha }}

      - name: Smoke test 1 - engine and deps import (CPU fallback)
        run: |
          docker run --rm --entrypoint python3 twhyne/twhyne:gpu-candidate \
            -c "import flask, sympy; from llama_cpp import Llama; print('CUDA engine imports OK (no GPU present)')"

      - name: Smoke test 2 - backend boots and answers exact math
        run: |
          docker run -d --name smoke --entrypoint sh -p 5002:5002 \
            twhyne/twhyne:gpu-candidate -c \
            'cd /app/backend && if [ -f server.pyc ]; then exec python3 server.pyc; else exec python3 server.py; fi'
          ok=""
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5002/status > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo 'backend never came up'; docker logs smoke; exit 1; fi
          RESP=$(curl -fs -X POST http://localhost:5002/query \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"What is 23 * 244866?"}')
          echo "query response: $RESP"
          echo "$RESP" | grep -q 5631918 || { echo 'exact math check FAILED'; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Smoke test 3 - real inference (CPU fallback) via embedding model
        run: |
          mkdir -p /tmp/models
          curl -Ls -o /tmp/models/bge-small-en-v1.5-f16.gguf \
            https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-f16.gguf
          docker run --rm --entrypoint python3 -v /tmp/models:/app/models twhyne/twhyne:gpu-candidate -c "
          from llama_cpp import Llama
          m = Llama(model_path='/app/models/bge-small-en-v1.5-f16.gguf', embedding=True, n_ctx=512, verbose=False)
          e = m.create_embedding('hello world')['data'][0]['embedding']
          assert len(e) >= 128, 'embedding too short'
          print('real inference OK (CPU fallback), dim', len(e))"

      - name: Push image (CPU-fallback-verified; GPU validation still required)
        run: |
          docker tag twhyne/twhyne:gpu-candidate twhyne/twhyne:gpu
          docker push twhyne/twhyne:gpu
