name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach assets to (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  dmg:
    name: Build real macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG with hdiutil
        run: |
          mkdir -p staging dist
          cp launch-twhyne.command "staging/Twhyne AI Launcher.command"
          chmod +x "staging/Twhyne AI Launcher.command"
          cat > "staging/READ ME FIRST.txt" <<'EOT'
          Twhyne AI - macOS setup

          1. Install Docker Desktop (https://www.docker.com/products/docker-desktop/)
             and open it once.
          2. Double-click "Twhyne AI Launcher.command".
             If macOS says it cannot verify the developer:
             RIGHT-CLICK the file -> Open -> Open.
          3. Enter your TWHYNE-... license key when prompted.
          4. The app opens at http://localhost:3000

          Everything runs on this Mac. Nothing leaves your machine.
          EOT
          hdiutil create -volname "Twhyne AI" -srcfolder staging -ov -format UDZO dist/twhyne-ai.dmg
          hdiutil verify dist/twhyne-ai.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/twhyne-ai.dmg

  release:
    name: Publish GitHub Release
    needs: dmg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build script launchers
        run: |
          mkdir -p dist
          # Windows
          cp launch-twhyne.bat dist/twhyne-ai-setup.bat
          # Linux
          cp launch-twhyne.command dist/twhyne-ai.AppImage
          chmod +x dist/twhyne-ai.AppImage

      - name: Fetch the real DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          name: Twhyne AI ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-alpha') || contains(github.event.inputs.tag_name || github.ref_name, '-beta') || contains(github.event.inputs.tag_name || github.ref_name, '-rc') }}
          body: |
            ## Twhyne AI ${{ github.event.inputs.tag_name || github.ref_name }}

            ### Installation

            **Requirements:** [Docker Desktop](https://www.docker.com/products/docker-desktop/) must be installed.

            | Platform | Download |
            |---|---|
            | Windows | `twhyne-ai-setup.bat` — double-click to run |
            | macOS | `twhyne-ai.dmg` — double-click (right-click → Open if Gatekeeper blocks it) |
            | Linux | `twhyne-ai.AppImage` — `chmod +x twhyne-ai.AppImage && ./twhyne-ai.AppImage` |

            ### First run
            1. Get a free license key at **https://twhyne.com**
            2. Run the launcher — it will prompt for your `TWHYNE-...` key
            3. The app opens at **http://localhost:3000**

            ### What's new
          files: |
            dist/twhyne-ai-setup.bat
            dist/twhyne-ai.dmg
            dist/twhyne-ai.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
