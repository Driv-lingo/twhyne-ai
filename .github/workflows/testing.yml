name: Testing Branch CI

on:
  push:
    branches: [ testing ]
  pull_request:
    branches: [ testing ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install flask flask-cors requests pillow numpy
    
    - name: Install optional ML dependencies
      continue-on-error: true
      run: |
        pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
    
    - name: Check Python syntax
      run: |
        cd backend
        python -m py_compile server.py
        python -m py_compile test_server.py
        python -m py_compile license_api_server.py
        python -m py_compile telemetry.py
        python -m py_compile admin_api.py
        python -m py_compile update_manager.py
        python -m py_compile rag_manager.py
        find flux_nodes -name "*.py" -exec python -m py_compile {} \;
    
    - name: Run unit tests
      env:
        SNF_ADMIN_SECRET: test-admin-secret
      run: |
        cd backend
        python -m unittest discover -s tests -v

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps
    
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint || echo "Linting completed with warnings"
    
    - name: Build frontend
      run: |
        cd frontend
        CI=false npm run build
    
    - name: Run frontend tests
      run: |
        cd frontend
        CI=true npm test -- --watchAll=false --passWithNoTests

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        pip install flask flask-cors requests pillow numpy
    
    - name: Start test backend server
      run: |
        cd backend
        python test_server.py > /tmp/test_server.log 2>&1 &
        echo $! > /tmp/test_server.pid
        sleep 3
    
    - name: Start license API server
      env:
        SNF_ADMIN_SECRET: ci-test-secret
      run: |
        cd backend
        python license_api_server.py > /tmp/license_server.log 2>&1 &
        echo $! > /tmp/license_server.pid
        sleep 3
    
    - name: Test backend health
      run: |
        echo "Testing test_server health..."
        curl -f -s http://localhost:5002/status | python -m json.tool
        echo "✅ Test server healthy"
        
        echo "Testing license server health..."
        curl -f -s http://localhost:5003/api/status | python -m json.tool
        echo "✅ License server healthy"
    
    - name: Run integration tests
      env:
        SNF_ADMIN_SECRET: ci-test-secret
        TEST_SERVER_URL: http://localhost:5002
        LICENSE_SERVER_URL: http://localhost:5003
      run: |
        cd backend
        python -m unittest tests.test_integration -v
    
    - name: Show server logs on failure
      if: failure()
      run: |
        echo "=== Test Server Log ===" && cat /tmp/test_server.log || true
        echo "=== License Server Log ===" && cat /tmp/license_server.log || true
