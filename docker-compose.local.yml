version: '3.8'

services:
  snf-ai-windsurf:
    build: .
    ports:
      - "3000:3000"  # Frontend
      - "5002:5002"  # Backend API
    volumes:
      - snf_models:/app/models      # Persist model files
      - snf_logs:/app/logs          # Persist logs
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  snf_models:
    driver: local
  snf_logs:
    driver: local
