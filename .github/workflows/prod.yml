name: Production Deployment

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install flask flask-cors pillow numpy
        pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
        cd frontend && npm ci
    
    - name: Run all tests
      run: |
        cd backend
        python -m pytest tests/ || echo "No tests found yet"
        cd ../frontend
        npm test -- --passWithNoTests
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        cd frontend && npm ci
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Create production artifact
      run: |
        mkdir -p artifacts
        tar -czf artifacts/twhyne-prod-${{ github.sha }}.tar.gz \
          backend/ \
          frontend/build/ \
          models/.gitkeep \
          uploads/.gitkeep \
          README.md \
          requirements.txt \
          start.sh
    
    - name: Upload production artifact
      uses: actions/upload-artifact@v3
      with:
        name: prod-release-${{ github.sha }}
        path: artifacts/twhyne-prod-${{ github.sha }}.tar.gz
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    
    steps:
    - name: Deployment Status
      run: |
        echo "Production deployment completed"
        echo "Status: ${{ needs.build-and-deploy.result }}"
